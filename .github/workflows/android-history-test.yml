name: Check MangoCare Android history

on:
  push:
    branches: [android-app]
    paths: ['.github/workflows/android-history-test.yml']

permissions:
  actions: read
  contents: read

jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Wait for signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 24); do
            status=$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/45005994801 --jq '.status')
            if [ "$status" = completed ]; then
              test "$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/45005994801 --jq '.conclusion')" = success
              exit
            fi
            sleep 10
          done
          exit 1
      - uses: actions/download-artifact@v8
        with:
          name: MangoCare-Android-APK
          run-id: 45005994801
          github-token: ${{ github.token }}
      - name: Prepare emulator and test script
        run: |
          sudo chmod a+rw /dev/kvm
          curl --fail --silent --show-error --location --max-time 20 -o MangoCare-sample.webp https://aditya070750.github.io/MangoCare-AI/static/mango-orchard.webp
          cat > /tmp/check-history.py <<'PY'
          import base64
          import json
          import re
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def adb(*args, capture=False):
              return subprocess.run(['adb', *args], check=True, stdout=subprocess.PIPE if capture else None).stdout

          def ui():
              adb('shell', 'uiautomator', 'dump', '/sdcard/mangocare-ui.xml', capture=True)
              return tuple(ET.fromstring(adb('exec-out', 'cat', '/sdcard/mangocare-ui.xml', capture=True)).iter('node'))

          def find(*labels, tries=5):
              for _ in range(tries):
                  nodes = ui()
                  node = next((node for node in nodes if node.get('text') in labels or node.get('content-desc') in labels), None)
                  if node is not None:
                      return node
              raise AssertionError((labels, [(node.get('text'), node.get('content-desc')) for node in nodes]))

          def tap(*labels):
              x1, y1, x2, y2 = map(int, re.findall(r'\d+', find(*labels).get('bounds')))
              adb('shell', 'input', 'tap', str((x1 + x2) // 2), str((y1 + y2) // 2))

          package = 'com.mangocare.app'
          activity = package + '/.MainActivity'
          adb('install', 'MangoCare-AI-debug.apk')
          adb('shell', 'mkdir', '-p', '/sdcard/Download')
          adb('push', 'MangoCare-sample.webp', '/sdcard/Download/MangoCare-sample.webp')
          adb('shell', 'am', 'start', '-W', '-n', activity)
          tap('History')
          find('No scans yet.')
          tap('Back to scanner')
          tap('Classification')
          tap('Add photos')
          tap('Show roots', 'Open navigation drawer')
          tap('Downloads')
          tap('MangoCare-sample.webp')
          tap('Classify photos')
          find('Scan complete.', tries=10)
          tap('Reset')
          adb('shell', 'am', 'force-stop', package)
          adb('shell', 'am', 'start', '-W', '-n', activity)
          tap('History')
          caption = find('Classification · Healthy', 'Classification · Anthracnose').get('text')
          find('Scanned photo')
          history = json.loads(adb('exec-out', 'run-as', package, 'cat', 'files/scan-history.json', capture=True))
          assert len(history) == 1 and set(history[0]) == {'caption', 'thumbnail'}
          assert history[0]['caption'] == caption and base64.b64decode(history[0]['thumbnail']).startswith(b'\xff\xd8')
          Path('MangoCare-History.png').write_bytes(adb('exec-out', 'screencap', '-p', capture=True))
          print('Verified one thumbnail and short caption after Reset and app restart.')
          PY
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 /tmp/check-history.py
      - uses: actions/upload-artifact@v7
        with:
          name: MangoCare-History-Preview
          path: MangoCare-History.png
          if-no-files-found: error
